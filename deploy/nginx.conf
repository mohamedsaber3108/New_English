map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  server_name language.example.com;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name language.example.com;
  ssl_certificate /etc/letsencrypt/live/language.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/language.example.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  client_max_body_size 1m;
  # Group-room WebSockets stay open; the app pings every 30 s, so 75 s comfortably covers idle periods.
  location /api/rooms {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 75s;
  }
  location / {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
